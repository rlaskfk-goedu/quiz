<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학 정보 퀴즈 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN for JSX support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 구글 앱스 스크립트 웹 앱 URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGRO2SKyfnKWnbRtRgCadQi1VfTs0KKgJqy929uVaI3TViitxixA2jqx7lcLJbpAGDWA/exec";

        const quizData = [
            {
                q: "소프트웨어와 하드웨어가 유기적으로 결합하여 문제 해결에 활용되는 장치를 무엇이라 합니까?",
                options: ["응용 프로그램", "운영 체제", "컴퓨팅 시스템", "인터페이스", "데이터베이스"],
                correct: 2,
                hint: "HW와 SW가 합쳐진 전체적인 체계를 뜻합니다.",
                exp: "컴퓨팅 시스템은 소프트웨어와 하드웨어가 유기적으로 결합하여 문제 해결에 활용되는 장치를 말합니다."
            },
            {
                q: "하나의 반도체 칩에 CPU, GPU 등 여러 주요 구성 요소를 통합한 칩을 무엇이라 합니까?",
                options: ["RAM", "SSD", "SoC(System on Chip)", "HDD", "Mainboard"],
                correct: 2,
                hint: "스마트폰에서 주로 사용되는 통합 칩입니다.",
                exp: "SoC는 하나의 반도체에 주요 구성 요소를 통합한 칩으로 스마트 기기에서 핵심 역할을 합니다."
            },
            {
                q: "외부의 데이터를 입력받는 장치로만 짝지어진 것은?",
                options: ["모니터, 프린터", "웹캠, 마우스", "스피커, 모니터", "프로젝터, 키보드", "프린터, 마이크"],
                correct: 1,
                hint: "사용자의 명령이나 데이터를 안으로 넣어주는 장치입니다.",
                exp: "웹캠, 마우스, 키보드, 마이크 등은 대표적인 입력 장치입니다."
            },
            {
                q: "하드웨어를 관리하고 응용 소프트웨어가 동작할 수 있는 환경을 제공하는 프로그램은?",
                options: ["그림판", "엑셀", "웹 브라우저", "운영 체제(OS)", "메신저 앱"],
                correct: 3,
                hint: "Windows, Android, iOS 등이 여기에 해당합니다.",
                exp: "운영 체제는 하드웨어를 관리하고 사용자가 앱을 쓸 수 있도록 돕는 기본 소프트웨어입니다."
            },
            {
                q: "센서로 환경 변화를 감지하고 소프트웨어로 제어하여 물리적 환경과 상호 작용하는 장치는?",
                options: ["가상 현실 시스템", "피지컬 컴퓨팅 시스템", "클라우드 컴퓨팅", "블록체인 시스템", "데이터 마이닝"],
                correct: 1,
                hint: "현실(Physical) 세계와 소통하는 컴퓨팅입니다.",
                exp: "센서로 주변 상황을 감지하고 액추에이터로 물리적 반응을 일으키는 것이 피지컬 컴퓨팅의 핵심입니다."
            },
            {
                q: "마이크로비트의 구성 요소 중 주변 빛의 밝기를 측정(0~255)하는 센서는?",
                options: ["온도 센서", "가속도 센서", "빛 감지 센서", "자기 센서", "소리 센서"],
                correct: 2,
                hint: "LED 스크린이 이 센서 역할도 함께 수행합니다.",
                exp: "마이크로비트 앞면의 LED 판은 빛을 감지하는 센서 역할도 합니다."
            },
            {
                q: "물체의 가속도나 충격의 세기를 측정하여 흔들림을 감지하는 센서는?",
                options: ["가속도 센서", "초음파 센서", "자기 센서", "온도 센서", "터치 센서"],
                correct: 0,
                hint: "만보기 앱에서 걸음 수를 측정할 때 사용됩니다.",
                exp: "가속도 센서는 물체의 움직임 상태를 감지하여 자동차, 로봇 등에 널리 쓰입니다."
            },
            {
                q: "초음파를 발사하여 돌아오는 시간을 측정함으로써 거리를 계산하는 센서는?",
                options: ["빛 감지 센서", "초음파 센서", "습도 센서", "소리 센서", "압력 센서"],
                correct: 1,
                hint: "주차 보조 시스템에서 장애물 거리를 잴 때 쓰입니다.",
                exp: "초음파 센서는 수cm에서 수m까지의 거리를 측정할 수 있습니다."
            },
            {
                q: "전기 에너지를 빛, 소리, 회전 등 물리적 동작으로 변환하는 출력 장치를 무엇이라 합니까?",
                options: ["센서", "메모리", "액추에이터", "프로세서", "인터페이스"],
                correct: 2,
                hint: "모터나 LED 등이 대표적입니다.",
                exp: "액추에이터는 제어 장치의 신호에 따라 물리적인 동작을 수행하는 장치입니다."
            },
            {
                q: "컴퓨팅 시스템의 동작 원리 순서로 가장 적절한 것은?",
                options: ["출력-처리-입력", "입력-처리-출력", "처리-입력-출력", "입력-출력-처리", "출력-입력-처리"],
                correct: 1,
                hint: "데이터가 들어가서(Input) 연산되고(Process) 나옵니다(Output).",
                exp: "일반적인 컴퓨팅 시스템은 데이터를 입력받아 처리한 후 결과를 출력하는 과정을 거칩니다."
            }
        ];

        const Icons = {
            Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Hint: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            ArrowRight: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        };

        function App() {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [status, setStatus] = useState(Array(10).fill(null));
            const [isFinished, setIsFinished] = useState(false);
            
            const [studentId, setStudentId] = useState("");
            const [studentName, setStudentName] = useState("");
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleSelect = (idx) => {
                if (answered) return;
                
                setAnswered(true);
                setSelectedIdx(idx);
                
                const isCorrect = idx === quizData[currentIdx].correct;
                const newStatus = [...status];
                newStatus[currentIdx] = isCorrect ? 'O' : 'X';
                setStatus(newStatus);

                if (isCorrect) {
                    setScore(prev => prev + 10);
                }
            };

            const nextQuestion = () => {
                if (currentIdx < quizData.length - 1) {
                    setCurrentIdx(currentIdx + 1);
                    setAnswered(false);
                    setSelectedIdx(null);
                    setShowHint(false);
                } else {
                    setIsFinished(true);
                }
            };

            const submitToSheet = async () => {
                if (!studentId || !studentName) {
                    alert("학번과 이름을 모두 입력해주세요.");
                    return;
                }

                setLoading(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            studentId,
                            name: studentName,
                            score
                        })
                    });
                    
                    setTimeout(() => {
                        setIsSubmitted(true);
                        setLoading(false);
                    }, 800);
                } catch (error) {
                    console.error(error);
                    alert("전송 중 오류가 발생했습니다.");
                    setLoading(false);
                }
            };

            if (isFinished) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-100">
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">퀴즈 결과</h2>
                            <div className="text-6xl font-black text-blue-600 my-6">{score}점</div>
                            
                            {score >= 50 && !isSubmitted ? (
                                <div className="space-y-4 border-t pt-6 text-left">
                                    <p className="text-sm text-blue-600 font-bold bg-blue-50 p-3 rounded-lg text-center mb-4">
                                        🎉 50점 이상입니다! 구글 시트에 기록할 수 있습니다.
                                    </p>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">학번</label>
                                        <input 
                                            type="text" 
                                            placeholder="예: 10101"
                                            className="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-400 outline-none transition-all"
                                            value={studentId}
                                            onChange={(e) => setStudentId(e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">이름</label>
                                        <input 
                                            type="text" 
                                            placeholder="예: 홍길동"
                                            className="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-400 outline-none transition-all"
                                            value={studentName}
                                            onChange={(e) => setStudentName(e.target.value)}
                                        />
                                    </div>
                                    <button 
                                        onClick={submitToSheet}
                                        disabled={loading}
                                        className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors disabled:bg-slate-300 shadow-lg shadow-blue-200"
                                    >
                                        {loading ? "전송 중..." : "구글 시트에 기록하기"}
                                    </button>
                                </div>
                            ) : isSubmitted ? (
                                <div className="py-10 animate-in">
                                    <div className="flex justify-center mb-4 text-green-500"><Icons.Check /></div>
                                    <p className="text-green-600 font-bold text-lg">성공적으로 기록되었습니다!</p>
                                    <p className="text-slate-400 text-sm mt-2">수업에 참여해 주셔서 감사합니다.</p>
                                </div>
                            ) : (
                                <div className="py-6 space-y-4">
                                    <p className="text-slate-500">아쉽게도 기록 가능 점수(50점)에 미치지 못했습니다.</p>
                                    <button 
                                        onClick={() => window.location.reload()}
                                        className="w-full bg-slate-800 text-white p-4 rounded-xl font-bold hover:bg-slate-900 transition-colors"
                                    >
                                        다시 도전하기
                                    </button>
                                </div>
                            )}

                            <footer className="mt-12 text-[10px] text-slate-300 uppercase tracking-widest">
                                2026 baegot middle school - Developed by Kim Nara
                            </footer>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center py-6 px-4 font-sans">
                    <div className="w-full max-w-5xl flex flex-col md:flex-row gap-6">
                        
                        {/* 메인 퀴즈 카드 */}
                        <div className="flex-1 bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-10 relative">
                            <div className="flex justify-between items-center mb-8">
                                <span className="bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-sm">
                                    Question {currentIdx + 1} / 10
                                </span>
                                <div className="flex items-center gap-2">
                                    <span className="text-slate-300 text-xs font-bold uppercase tracking-wider">Score</span>
                                    <span className="text-blue-600 text-xl font-black">{score}</span>
                                </div>
                            </div>

                            <h3 className="text-2xl font-bold text-slate-800 leading-tight mb-6">
                                {quizData[currentIdx].q}
                            </h3>

                            <div className="mb-8">
                                <button 
                                    onClick={() => setShowHint(!showHint)}
                                    className="flex items-center gap-1.5 text-xs text-amber-500 font-bold hover:text-amber-600 transition-all bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-100"
                                >
                                    <Icons.Hint />
                                    {showHint ? "HINT CLOSE" : "HINT OPEN"}
                                </button>
                                {showHint && (
                                    <div className="mt-3 bg-amber-50 border-l-4 border-amber-400 p-4 text-sm text-amber-900 rounded-r-xl animate-in">
                                        {quizData[currentIdx].hint}
                                    </div>
                                )}
                            </div>

                            <div className="space-y-3">
                                {quizData[currentIdx].options.map((choice, i) => {
                                    let style = "border-slate-100 bg-slate-50 text-slate-700 hover:border-blue-200 hover:bg-slate-100";
                                    if (answered) {
                                        if (i === quizData[currentIdx].correct) style = "bg-green-500 text-white border-green-500 shadow-md scale-[1.02]";
                                        else if (i === selectedIdx) style = "bg-red-500 text-white border-red-500 shadow-md";
                                        else style = "opacity-40 border-slate-100 bg-slate-50";
                                    }

                                    return (
                                        <button
                                            key={i}
                                            disabled={answered}
                                            onClick={() => handleSelect(i)}
                                            className={`w-full p-5 text-left rounded-2xl border-2 transition-all font-semibold flex items-center justify-between group ${style}`}
                                        >
                                            <div className="flex items-center gap-4">
                                                <span className={`w-7 h-7 flex items-center justify-center rounded-full text-xs border ${answered ? 'border-white/30' : 'border-slate-200 bg-white text-slate-400 group-hover:border-blue-300 group-hover:text-blue-500'}`}>
                                                    {i + 1}
                                                </span>
                                                <span>{choice}</span>
                                            </div>
                                            {answered && i === quizData[currentIdx].correct && <Icons.Check />}
                                            {answered && i === selectedIdx && i !== quizData[currentIdx].correct && <Icons.X />}
                                        </button>
                                    );
                                })}
                            </div>

                            {answered && (
                                <div className="mt-8 bg-slate-50 border border-slate-100 rounded-2xl p-6 animate-in">
                                    <div className="flex items-center gap-2 mb-3 text-slate-400">
                                        <span className="text-[10px] font-black uppercase tracking-widest">Feedback</span>
                                        <div className="h-[1px] flex-1 bg-slate-200"></div>
                                    </div>
                                    <p className="text-slate-600 leading-relaxed font-medium mb-6">
                                        {quizData[currentIdx].exp}
                                    </p>
                                    <button 
                                        onClick={nextQuestion}
                                        className="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-black transition-all shadow-lg active:scale-[0.98]"
                                    >
                                        {currentIdx === quizData.length - 1 ? "FINISH QUIZ" : "NEXT QUESTION"}
                                        <Icons.ArrowRight />
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* 우측 진행 리스트 */}
                        <div className="w-full md:w-56 space-y-4">
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
                                <h4 className="text-[10px] font-black text-slate-300 uppercase mb-6 tracking-[0.2em] text-center">Progress Board</h4>
                                <div className="grid grid-cols-5 md:grid-cols-2 gap-3">
                                    {status.map((s, i) => (
                                        <div 
                                            key={i}
                                            className={`h-14 flex flex-col items-center justify-center rounded-2xl text-xs font-black border-2 transition-all
                                                ${currentIdx === i ? "border-blue-500 bg-blue-50 text-blue-600 scale-110 z-10 shadow-sm" : 
                                                    s === 'O' ? "border-green-100 bg-green-50 text-green-500" :
                                                    s === 'X' ? "border-red-100 bg-red-50 text-red-500" :
                                                    "border-transparent bg-slate-50 text-slate-300"}
                                            `}
                                        >
                                            <span className="opacity-40 mb-1">{i + 1}</span>
                                            <span className="text-base">
                                                {s === 'O' ? "O" : s === 'X' ? "X" : "-"}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="bg-slate-900 rounded-3xl p-6 text-white overflow-hidden relative">
                                <div className="relative z-10">
                                    <p className="text-[10px] font-bold opacity-50 mb-1">CURRENT STATUS</p>
                                    <p className="text-sm font-bold">{currentIdx + 1} / 10 Completed</p>
                                </div>
                                <div className="absolute -right-4 -bottom-4 opacity-10 rotate-12">
                                    <Icons.Check />
                                </div>
                            </div>

                            <footer className="hidden md:block text-center py-4 text-[10px] text-slate-300 font-bold uppercase tracking-widest leading-loose">
                                baegot middle school<br/>Information Class<br/>© 2026
                            </footer>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
